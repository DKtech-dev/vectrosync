services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vectrosync:2.0.0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      WELL_ID: Baghewala-14
      VECTROSYNC_API_KEY: "${VECTROSYNC_API_KEY:-}"
      VECTROSYNC_CORS_ORIGINS: "${VECTROSYNC_CORS_ORIGINS:-http://localhost:8000}"
      VECTROSYNC_MAX_CSV_BYTES: "2097152"
      VECTROSYNC_MAX_WEBSOCKETS: "5"
    volumes:
      - ./configs:/app/configs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.5

  cockpit:
    image: vectrosync:2.0.0
    depends_on:
      - api
    restart: unless-stopped
    init: true
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./configs:/app/configs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.5
